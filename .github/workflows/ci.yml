name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Warnings are denied on this crate via the clippy step, not RUSTFLAGS.
  # A global RUSTFLAGS=-D warnings also fails the path dependency numb.rs,
  # which still has dead_code warnings.

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          if [ -d src ]; then echo "ready=true" >> "$GITHUB_OUTPUT"
          else echo "ready=false" >> "$GITHUB_OUTPUT"; echo "::notice::No src/ yet - Rust checks skipped until the crate has code."; fi

  rust:
    needs: detect
    if: needs.detect.outputs.ready == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: qbit.rs
    steps:
      - uses: actions/checkout@v4
        with:
          path: qbit.rs
      - uses: actions/checkout@v4
        with:
          repository: iamjakkie/numb.rs
          path: numb.rs
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: qbit.rs
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: test
        run: cargo test --all-features
